packages:
  - 'apps/*'
  - 'packages/*'

# Transitive dependency patches — not a direct dependency of anything in this repo, just a
# vulnerable sub-dependency pulled in by something we do depend on. Pin the patched version
# without touching the actual pinned prisma v6 version.
overrides:
  # deepmerge-ts <8.0.0 has a stack-exhaustion DoS on recursive object graphs
  # (GHSA-ggr8-5vv4-36mx). Pulled in transitively via prisma -> @prisma/config -> deepmerge-ts
  # (Prisma's own CLI tooling, not something this app's runtime code calls) - found by the first
  # real `pnpm audit` run wired into CI. Low real-world reachability here (build-tool-only, no
  # untrusted input reaches it), but the patched version is a trivial, safe bump.
  deepmerge-ts: '>=8.0.0'
# Build-script approval — pnpm 11 refuses to run postinstall scripts for these deps unless
# explicitly allowlisted here (a supply-chain safety default: `pnpm install` prints only a
# warning locally, but `pnpm install --frozen-lockfile` in CI treats it as a hard error, exit
# code 1 — found via the first real GitHub Actions run in Stage 7).
#
# The key is `allowBuilds` (object of packageName -> boolean), NOT `onlyBuiltDependencies`
# (that's the pnpm <=10 name — pnpm 11 silently ignores it with no error, which cost real time
# to debug here). Confirmed by pnpm's own behavior: when it hits ignored builds with no
# interactive TTY, it auto-injects an `allowBuilds:` block into this exact file with placeholder
# string values ("set this to true or false") instead of prompting — that's how the correct key
# name was actually discovered. If you ever see that placeholder block reappear (e.g. after
# running a bare `pnpm install` locally with no flags), it means real booleans got wiped —
# restore explicit `true`/`false` values here, never leave the placeholder strings.
#
# Previously this project tried approving builds via `.pnpmfile.cjs`'s readPackage hook setting
# `pkg.pnpm.allowBuild` on each dependency's own manifest — that never worked either, because
# pnpm only honors an allowlist declared by the ROOT project (here), not a package self-declaring
# itself trusted (which would defeat the point of the check).
#
# Always verify with `pnpm install --frozen-lockfile` (the exact CI invocation) after editing
# this block, and check the real exit code directly (`echo $?` right after the bare command,
# not through a `| tail` pipe — that reports tail's exit code instead of pnpm's).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # @scarf/scarf (pulled in by swagger-ui-dist, a @nestjs/swagger dependency, added Stage 8) is
  # a telemetry-only postinstall script - pings scarf.sh with an anonymous download counter, no
  # functional purpose. Denied deliberately, not left as an oversight.
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
